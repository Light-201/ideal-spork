<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(to top, #294e23, #151922, #151922, #294e23); margin: 0px; min-height: 100vh;">
    <!--TOP BAR-->
    <div id="bar">
    <div id="topbar" class="cont">
        <img id='logo' src="Photos/IMG_0235.jpg" alt="logo">
        <div id="info">
            <p id="Topbar"></p>
            <p id="desc">Miscellaneous Notepad.</p>
        </div>
        <div class="social">
        <a href="https://discord.com/users/890951492675174410" target="_blank">
            <img id="dc" src="Photos/Discord-Symbol-White.png" alt="Discord">
        </a>
        <img id="insta" src="Photos/Instagram_Glyph_Gradient.png" alt="instagram">  
        </div>
    </div>
    <hr style="margin: 0;">
    </div>
    <!--Main Body-->
    <div id='Main'style="margin: 5px; margin-top: 60px;">
        <div class="cont">
            <div class="trans" id="Notepad" style="position: relative;">
                <textarea id='ntpinput' type='text' placeholder="Begin Brainstroming..."></textarea>
                <button id="Savebtn"><b>Save</b></button>
            </div>
            <div id="web">
                <div class="cont">
                    <div class="trans" id="Defsearch" style="position: relative;">
                        <input type="search" id="dfinput" placeholder="Definition Search"></input>
                        <button id="Search"><b>Search</b></button>
                    </div>
                    <div class="cont" id="placeholder">
                        <div id="Clock">
                            <h1 id="Time">00:00:00</h1>
                        </div>
                    </div>  
                </div>
                <div class="trans" id="miniweb"></div>
            </div>
        </div>
        <div class="cont" style="margin: 5px; padding: 5px; margin-top: 15px;">
            <div class="trans" id="quicklinks">
                <div class="cont" style="gap: 30px;">
                    <div>
                        <a href="https://www.nytimes.com/games/wordle/index.html" target="_blank">
                            <img class="imgs" src="Photos/nyt-wordle.svg" alt="Wordle">
                            <p>Wordle</p>
                        </a>
                    </div>
                    <div>
                        <a href="https://www.nytimes.com/games/connections" target="_blank">
                        <img class="imgs" src="Photos/nyt-connections.svg" alt="Connections">
                        <p style="margin-left: -6px;">Connections</p>
                        </a>
                    </div>
                    <div>
                        <a href="https://headcountgame.com/" target="_blank">
                        <img class="imgs" src="Photos/favicon.ico" alt="Headcount" style="border-radius: 5px;">
                        <p style="margin-left: -2px;">HeadCount</p>
                        </a>
                    </div>
                </div>
                <div class="cont" style="gap: 30px; margin-top: 10px;">
                    <div>
                        <a href="https://krillion.io/" target="_blank">
                        <img class="imgs" src="Photos/krillion-gold.png" alt="krillion">
                        <p>Krillion</p>
                        </a>
                    </div>
                    <div>
                        <a href="https://roughly.is/" target="_blank">
                        <img class="imgs" src="Photos/icon-192.png" alt="Roughly.is">
                        <p>Roughly</p>
                        </a>
                    </div>
                </div>
            </div>
            <div id="quote" class="trans">
                <h2 style="margin-left: 15px;">Daily Quote</h2>
                <hr style="margin: 5px 10px 5px 10px;">
                <blockquote id="Quote"><i>Loading</i></blockquote>
                <p id="author"></p>
                <p id="date">DD-MM-YY</p>
                <footer>Powered by zenquotes.io</footer>
            </div>
            <div class="trans" id="BusTimeTableDiv">
                <h2 style="margin-left: 15px;">TimeTable</h2>
                <hr style="margin: 0px;">
                <ul id="busnav" style="display: flex; gap: 10px;">
                    <li>Oia</li>
                    <li>Kamari</li>
                    <li>Perissa</li>
                    <li>Akrotiri</li>
                </ul>
                <hr style="margin: 0px;">
                <div class="cont" style="margin-left: 100px;" id="times">
                    <div>
                        <h3 style="margin-right: 200px; width: 140px;">Weekdays</h3>
                        <div class="table" id="weekdays">
                            <div class="fira">
                                <p>From Fira</p>
                            </div>
                            <div class="location">
                                <p class="from">From </p>
                            </div>
                        </div>
                    </div>  
                    <div>
                        <h3>Sundays</h3>
                        <div class="table" id="sundays">
                            <div class="fira">
                                <p>From Fira</p>
                            </div>
                            <div class="location">
                                <p class="from">From  </p>
                            </div>
                        </div>
                        <h3>Saturdays</h3>
                        <div class="table" id="Saturdays">
                            <div class="fira">
                                <p>From Fira</p>
                            </div>
                            <div class="location">
                                <p class="from">From  </p>
                            </div>
                        </div>
                    </div>
                    
                </div>
                <footer id="lastupd">Last Updated:</footer>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

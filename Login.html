<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

#login{
    background: rgba(147, 147, 147, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

*{
    font-family: Arial, Helvetica, sans-serif;
    color: White;
}

#inputs{
    width: 100%;
    margin-top: 10%;
    aspect-ratio: 1/0.5;

}

.inps{
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 250px;
    margin: 0 auto 15px;
}

.int{
    margin: 2% 0;
    width: 100%;
    height: 30px;
    box-sizing: border-box;

    /* STYLING */
    background-color: rgb(47, 47, 47);
    border-radius: 7px;
    border: 0.5px solid rgba(255, 255, 255, 0.2);
    outline: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.labels{
    margin: 5px 0 0;
    color: rgba(149, 149, 149, 0.721);
    text-align: left;
    display: flex;
}

#loginbtn{
    margin: 9% auto 0;
    width: 150px;
    aspect-ratio: 1/0.25;
    border-radius: 5px;
    background: rgba(90, 90, 187, 0.54);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.int:focus{
    border: 1px solid rgba(23, 93, 192, 1);
}

#signinbtn{
    margin: 9% 2% 0;
    width: 140px;
    aspect-ratio: 1/0.25;
    border-radius: 5px;
    background: rgba(70, 70, 74, 0.54);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

a{
    text-decoration: none;
}
</style>

<body style="background: radial-gradient(circle, #294e23 0%, #151922 70%); min-height: 100vh;">
    <div id="login" style="height: 500px; aspect-ratio: 1/1;">
        <h1>Welcome Back!</h1>
        <p style="font-size: 14px;">Please Login before we continue.</p>
        <div id="inputs">
            <div class="inps">
                <label class="labels" for="user">Username<div aria-hidden="true" data-text-variant="text-md/normal" style="color: rgb(209, 83, 83); margin-left: 2px;">*</div></label>
                <input class="int" id="user" required>
            </div>
            <div class="inps">
                <label class="labels" for="pass">Password<div aria-hidden="true" data-text-variant="text-md/normal" style="color: rgb(209, 83, 83); margin-left: 2px;">*</div></label>
                <input class="int" id="pass" type="password" required>
                <a href="google.com" style="width: 110px;">
                    <p class="labels" style="font-size: 13px; margin: 2px 2px; color: rgba(77, 77, 205, 0.799);">Forgot Password?</p>
                </a>
            </div>
            <div>
                <button id="loginbtn"><b>Log in</b></button>
                <button id="signinbtn"><b>Sign in</b></button>
            </div>
        </div>
    </div>
</body>
</html>

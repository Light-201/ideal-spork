<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Class Progame</title>
    <link rel="stylesheet" href="schlstyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b3522">
</head>
<body>
    <header class="trans cont">
        <div id="info">
            <h1 style="font-size: 25px; margin-left: 20px;">Weekly School Progame A'2</h1>
        </div>
    </header>
    <hr style="margin: 0px;">
    <div class="main trans timetable">

        <div class="cell"></div>
        <div class="cell">Monday</div>
        <div class="cell">Tuesday</div>
        <div class="cell">Wednesday</div>
        <div class="cell">Thursday</div>
        <div class="cell">Friday</div>

        <div class="cell period">1</div>
        <div class="cell" data-day="Monday" data-period="1"></div>
        <div class="cell" data-day="Tuesday" data-period="1"></div>
        <div class="cell" data-day="Wednesday" data-period="1"></div>
        <div class="cell" data-day="Thursday" data-period="1"></div>
        <div class="cell" data-day="Friday" data-period="1"></div>

        <div class="cell period">2</div>
        <div class="cell" data-day="Monday" data-period="2"></div>
        <div class="cell" data-day="Tuesday" data-period="2"></div>
        <div class="cell" data-day="Wednesday" data-period="2"></div>
        <div class="cell" data-day="Thursday" data-period="2"></div>
        <div class="cell" data-day="Friday" data-period="2"></div>

        <div class="cell period">3</div>
        <div class="cell" data-day="Monday" data-period="3"></div>
        <div class="cell" data-day="Tuesday" data-period="3"></div>
        <div class="cell" data-day="Wednesday" data-period="3"></div>
        <div class="cell" data-day="Thursday" data-period="3"></div>
        <div class="cell" data-day="Friday" data-period="3"></div>

        <div class="cell period">4</div>
        <div class="cell" data-day="Monday" data-period="4"></div>
        <div class="cell" data-day="Tuesday" data-period="4"></div>
        <div class="cell" data-day="Wednesday" data-period="4"></div>
        <div class="cell" data-day="Thursday" data-period="4"></div>
        <div class="cell" data-day="Friday" data-period="4"></div>

        <div class="cell period">5</div>
        <div class="cell" data-day="Monday" data-period="5"></div>
        <div class="cell" data-day="Tuesday" data-period="5"></div>
        <div class="cell" data-day="Wednesday" data-period="5"></div>
        <div class="cell" data-day="Thursday" data-period="5"></div>
        <div class="cell" data-day="Friday" data-period="5"></div>

        <div class="cell period">6</div>
        <div class="cell" data-day="Monday" data-period="6"></div>
        <div class="cell" data-day="Tuesday" data-period="6"></div>
        <div class="cell" data-day="Wednesday" data-period="6"></div>
        <div class="cell" data-day="Thursday" data-period="6"></div>
        <div class="cell" data-day="Friday" data-period="6"></div>

    </div>
    <!-- Mobile Timetable -->
    <div id="mobileTimetable">
        <h2 id="mobileDay" style="margin-left: 20px;"></h2>
        <div id="mobileClasses"></div>
        <div class="day-navigation">
            <button class="trans btn" id="prevDay">Previous</button>
            <button class="trans btn" id="nextDay">Next</button>
        </div>
    </div>
    <!------>
    <div class="todolist trans">
        <div class="cont" style="align-items: center;">
            <h2>To-Do List</h2>
            <svg id="plusicon" xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </div>
        <hr style="margin: 0px 0px 20px 0px; border: 1px solid white">
        <div class="subject-card" style="display: none;">
            <div class="cont1">
                <div class="circle"></div>
                <h5 class="subjectName">N/A</h5>
                <div class="cont2">
                    <svg class="editicon" fill="currentColor" stroke="currentColor" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 494.936 494.936" xml:space="preserve">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier"><g><g>
                        <path d="M389.844,182.85c-6.743,0-12.21,5.467-12.21,12.21v222.968c0,23.562-19.174,42.735-42.736,42.735H67.157 c-23.562,0-42.736-19.174-42.736-42.735V150.285c0-23.562,19.174-42.735,42.736-42.735h267.741c6.743,0,12.21-5.467,12.21-12.21 s-5.467-12.21-12.21-12.21H67.157C30.126,83.13,0,113.255,0,150.285v267.743c0,37.029,30.126,67.155,67.157,67.155h267.741 c37.03,0,67.156-30.126,67.156-67.155V195.061C402.054,188.318,396.587,182.85,389.844,182.85z"></path>
                        <path d="M483.876,20.791c-14.72-14.72-38.669-14.714-53.377,0L221.352,229.944c-0.28,0.28-3.434,3.559-4.251,5.396l-28.963,65.069 c-2.057,4.619-1.056,10.027,2.521,13.6c2.337,2.336,5.461,3.576,8.639,3.576c1.675,0,3.362-0.346,4.96-1.057l65.07-28.963 c1.83-0.815,5.114-3.97,5.396-4.25L483.876,74.169c7.131-7.131,11.06-16.61,11.06-26.692 C494.936,37.396,491.007,27.915,483.876,20.791z M466.61,56.897L257.457,266.05c-0.035,0.036-0.055,0.078-0.089,0.107 l-33.989,15.131L238.51,247.3c0.03-0.036,0.071-0.055,0.107-0.09L447.765,38.058c5.038-5.039,13.819-5.033,18.846,0.005 c2.518,2.51,3.905,5.855,3.905,9.414C470.516,51.036,469.127,54.38,466.61,56.897z"></path>
                        </g></g></g>
                    </svg>
                    <svg id="trashicon" class="delete" src="trash-can-svgrepo-com(1).svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </div>
            </div>
            <hr>
            <textarea class="tdarea contenttext" readonly>Test</textarea>
        </div>
    </div>
    <!-- POPUPS -->
     <div class="popup trans">
        <div class="content trans">
            <span id="closePopup">&times;</span>
            <h2 style="text-align: center;">Add New Task</h2>
            <textarea id="maketodo" placeholder="Make a Todo"></textarea>
            <p>Select a Subject</p>
            <select id="subjectSelect"></select>
            <button class="confirm trans">Confirm</button>
            <button class="edit trans" style="display: none;">Edit</button>
        </div>
     </div>
    <script src="scripts.js"></script>
</body>
</html>
